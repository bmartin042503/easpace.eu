<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--
    Theme and language before the first paint, from the stored choices (the app's preference keys), else from the OS
    and browser preferences
    -->
    <script>
        (function () {
            var root = document.documentElement;
            var appearance = "system";
            var language = null;

            root.classList.add("js");

            try {
                var storedAppearance = localStorage.getItem("color-scheme-appearance");
                if (storedAppearance === "light" || storedAppearance === "dark" || storedAppearance === "system") {
                    appearance = storedAppearance;
                }

                var storedLanguage = localStorage.getItem("language");
                if (storedLanguage === "en" || storedLanguage === "hu") language = storedLanguage;
            } catch (e) {
                // storage blocked: follow the OS and browser preferences
            }

            var dark = appearance === "dark"
                || (appearance === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);

            root.dataset.theme = dark ? "dark" : "light";

            // the first browser language that the site has, as the app does with the OS language
            if (!language) {
                var preferred = navigator.languages && navigator.languages.length
                    ? navigator.languages
                    : [navigator.language || "en"];

                language = "en";

                for (var i = 0; i < preferred.length; i++) {
                    var primary = String(preferred[i]).toLowerCase().split("-")[0];
                    if (primary === "hu" || primary === "en") {
                        language = primary;
                        break;
                    }
                }
            }

            root.lang = language;

            // the page is written in English; hide it until the translation is applied, at most for a second
            if (language !== "en") {
                root.classList.add("i18n-pending");
                setTimeout(function () {
                    root.classList.remove("i18n-pending");
                }, 1000);
            }
        })();
    </script>

    <title data-i18n="Meta.Page.Title">easpace – A private space for your thoughts</title>
    <meta name="description" data-i18n-attr="content:Meta.Page.Description"
          content="easpace is a free, open-source app: a quiet, private space for self-reflection, personal tracking and wellbeing.">
    <meta name="theme-color" content="#daf4fd">
    <link rel="preload" href="fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <script type="module" src="js/main.js"></script>
    <!-- fetch the imported modules right away instead of after main.js -->
    <link rel="modulepreload" href="js/i18n.js">
    <link rel="modulepreload" href="js/locales/hu.js">
    <link rel="modulepreload" href="js/theme.js">
</head>
<body>
    <!-- Icons: Phosphor Icons (https://phosphoricons.com), MIT License, Copyright (c) 2023 Phosphor Icons -->

        </symbol>
        <symbol id="icon-sun" viewBox="0 0 256 256">
            <path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm8,24a64,64,0,1,0,64,64A64.07,64.07,0,0,0,128,64ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z" />
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 256 256">
            <path d="M235.54,150.21a104.84,104.84,0,0,1-37,52.91A104,104,0,0,1,32,120,103.09,103.09,0,0,1,52.88,57.48a104.84,104.84,0,0,1,52.91-37,8,8,0,0,1,10,10,88.08,88.08,0,0,0,109.8,109.8,8,8,0,0,1,10,10Z" />

    <header class="site-header">
        <!-- Language switch: endonyms as accessible names, as in the app, so they aren't translated -->
        <div class="segmented js-only" role="radiogroup" aria-label="Language"
             data-i18n-attr="aria-label:Header.Language.Label">
            <label lang="en" title="English">
                <input type="radio" name="language" value="en">
                <span class="segment">
                    <span aria-hidden="true">EN</span>
                    <span class="visually-hidden">English</span>
                </span>
            </label>
            <label lang="hu" title="Magyar">
                <input type="radio" name="language" value="hu">
                <span class="segment">
                    <span aria-hidden="true">HU</span>
                    <span class="visually-hidden">Magyar</span>
                </span>
            </label>
        </div>

        <!-- Appearance switch (the app's System / Light / Dark setting) -->
        <div class="segmented js-only" role="radiogroup" aria-label="Appearance"
             data-i18n-attr="aria-label:Header.Appearance.Label">
            <label title="System" data-i18n-attr="title:Header.Appearance.System">
                <input type="radio" name="appearance" value="system">
                <span class="segment">
                    <svg class="icon" aria-hidden="true"><use href="#icon-circle-half"></use></svg>
                    <span class="visually-hidden" data-i18n="Header.Appearance.System">System</span>
                </span>
            </label>
            <label title="Light" data-i18n-attr="title:Header.Appearance.Light">
                <input type="radio" name="appearance" value="light">
                <span class="segment">
                    <svg class="icon" aria-hidden="true"><use href="#icon-sun"></use></svg>
                    <span class="visually-hidden" data-i18n="Header.Appearance.Light">Light</span>
                </span>
            </label>
            <label title="Dark" data-i18n-attr="title:Header.Appearance.Dark">
                <input type="radio" name="appearance" value="dark">
                <span class="segment">
                    <svg class="icon" aria-hidden="true"><use href="#icon-moon"></use></svg>
                    <span class="visually-hidden" data-i18n="Header.Appearance.Dark">Dark</span>
                </span>
            </label>
        </div>
    </header>

    <main>
        <!-- Hero -->
        <section id="hero">
            <h1>easpace</h1>
            <p data-i18n="Hero.Text.Subtitle">A private space for your thoughts.</p>
        </section>
    </main>

    <footer></footer>
</body>
</html>
